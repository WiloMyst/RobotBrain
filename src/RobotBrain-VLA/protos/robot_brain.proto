syntax = "proto3";

package Robot;

// 云端向具身智能大脑下发的任务
message TaskRequest {
  string task_id = 1;         // 任务唯一追踪号
  string command = 2;         // 语义指令，如 "前进并抓取红色杯子"
  int32 priority = 3;         // 任务优先级
}

// 机器人本体给云端的回执
message TaskResponse {
  bool accepted = 1;          // 是否接受任务 (如果底盘被卡住可以拒绝)
  string status_msg = 2;      // 状态详情
}

// 机器人专属的 gRPC 服务
service BrainService {
  // 单次调用：下发高级任务指令
  rpc AssignTask(TaskRequest) returns (TaskResponse) {}
}